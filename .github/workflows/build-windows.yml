name: Build Windows EXE

on:
  workflow_dispatch:            # 手动触发：在 Actions 页面点 "Run workflow"
  push:
    tags:
      - "v*"                    # 推送 v1.1.0 这类 tag 时自动构建并发布 Release

permissions:
  contents: write               # 发布 Release 需要写权限

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MuToolsCode/package-lock.json

      - name: 安装 Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: MuToolsCode/src-tauri

      - name: 安装前端依赖
        working-directory: MuToolsCode
        run: npm ci

      - name: 构建 Tauri (EXE + NSIS + MSI)
        working-directory: MuToolsCode
        run: npm run tauri build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MuTools-Windows
          if-no-files-found: error
          retention-days: 30
          path: |
            MuToolsCode/src-tauri/target/release/mutools.exe
            MuToolsCode/src-tauri/target/release/bundle/nsis/*.exe
            MuToolsCode/src-tauri/target/release/bundle/msi/*.msi

      - name: 发布 Release (仅 tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MuToolsCode/src-tauri/target/release/mutools.exe
            MuToolsCode/src-tauri/target/release/bundle/nsis/*.exe
            MuToolsCode/src-tauri/target/release/bundle/msi/*.msi
